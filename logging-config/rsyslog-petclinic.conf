# Rsyslog configuration for Pet Clinic CI/CD Pipeline
# This configuration centralizes system and application logs
# Requirements: 9.1, 9.2

# Pet Clinic Application Logs
$template PetClinicFormat,"%TIMESTAMP% %HOSTNAME% %syslogtag% %msg%\n"

# Create separate log files for different components
if $programname == 'petclinic-frontend' then {
    /var/log/petclinic/frontend.log;PetClinicFormat
    stop
}

if $programname == 'petclinic-backend' then {
    /var/log/petclinic/backend.log;PetClinicFormat
    stop
}

if $programname == 'jenkins' then {
    /var/log/jenkins/jenkins-system.log;PetClinicFormat
    stop
}

# Security-related logs
if $msg contains 'authentication' or $msg contains 'login' or $msg contains 'security' then {
    /var/log/petclinic/security.log;PetClinicFormat
}

# Error logs
if $syslogseverity <= 3 then {
    /var/log/petclinic/errors.log;PetClinicFormat
}

# Database-related logs
if $msg contains 'mysql' or $msg contains 'database' or $msg contains 'sql' then {
    /var/log/petclinic/database.log;PetClinicFormat
}

# AWS-related logs
if $msg contains 'aws' or $msg contains 's3' or $msg contains 'cloudformation' then {
    /var/log/petclinic/aws.log;PetClinicFormat
}

# Log rotation configuration
$WorkDirectory /var/spool/rsyslog
$ActionFileDefaultTemplate PetClinicFormat
$ActionFileEnableSync on
$ActionResumeRetryCount -1
$ActionQueueFileName petclinic_queue
$ActionQueueMaxDiskSpace 1g
$ActionQueueSaveOnShutdown on
$ActionQueueType LinkedList
$ActionResumeRetryCount -1

# Remote logging to centralized log server (if configured)
# Uncomment and configure the following lines for centralized logging
# *.* @@log-server.example.com:514

# CloudWatch Logs integration (requires awslogs agent)
# This will be configured separately in the CloudWatch setup