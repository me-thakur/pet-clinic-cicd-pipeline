# Jenkins Logging Configuration
# This file configures logging for Jenkins CI/CD operations
# Requirements: 9.1, 9.2

# Root logger configuration
.level = INFO
handlers = java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Console handler configuration
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# File handler configuration for general Jenkins logs
java.util.logging.FileHandler.pattern = /var/log/jenkins/jenkins-%g.log
java.util.logging.FileHandler.limit = 104857600
java.util.logging.FileHandler.count = 10
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.FileHandler.level = INFO

# Jenkins-specific logger configurations

# Build and deployment logging
hudson.level = INFO
hudson.model.level = INFO
hudson.model.Run.level = INFO
hudson.model.AbstractBuild.level = INFO

# Pipeline logging
org.jenkinsci.plugins.workflow.level = INFO
org.jenkinsci.plugins.workflow.job.level = INFO
org.jenkinsci.plugins.workflow.cps.level = INFO

# SCM logging (Git integration)
hudson.plugins.git.level = INFO
hudson.scm.level = INFO

# Security logging
hudson.security.level = INFO
jenkins.security.level = INFO
org.springframework.security.level = INFO

# Plugin logging
hudson.PluginManager.level = INFO
hudson.PluginWrapper.level = INFO

# Backup logging
org.jvnet.hudson.plugins.thinbackup.level = INFO

# AWS integration logging
com.amazonaws.level = WARN
com.amazonaws.services.s3.level = INFO

# Reduce noise from verbose components
hudson.model.UpdateCenter.level = WARNING
hudson.util.ProcessTree.level = WARNING
hudson.remoting.level = WARNING
hudson.slaves.level = WARNING

# Performance logging
hudson.model.Queue.level = INFO
hudson.model.Executor.level = INFO

# Custom formatters for structured logging
java.util.logging.SimpleFormatter.format = %1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$s %2$s %5$s%6$s%n