AWSTemplateFormatVersion: '2010-09-09'
Description: 'Master CloudFormation template for Pet Clinic CI/CD Pipeline infrastructure'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name for resource tagging and configuration

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: EC2 instance type for Jenkins server

  DatabaseInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]
    Description: RDS instance class for database

  KeyPairName:
    Type: String
    Description: EC2 Key Pair for SSH access to instances
    Default: ''

  AdminCIDR:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block for admin access (restrict in production)
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$

  TemplateBaseURL:
    Type: String
    Description: Base URL for nested CloudFormation templates
    Default: https://s3.amazonaws.com/your-cf-templates-bucket

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Environment Configuration
        Parameters:
          - Environment
          - TemplateBaseURL
      - Label:
          default: Compute Configuration
        Parameters:
          - InstanceType
          - KeyPairName
          - AdminCIDR
      - Label:
          default: Database Configuration
        Parameters:
          - DatabaseInstanceClass

Resources:
  # IAM Stack - Must be created first for roles and policies
  IAMStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub '${TemplateBaseURL}/iam.yaml'
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: PetClinicCICD

  # Network Stack - VPC, subnets, security groups
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub '${TemplateBaseURL}/network.yaml'
      Parameters:
        Environment: !Ref Environment
        AdminCIDR: !Ref AdminCIDR
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: PetClinicCICD

  # Storage Stack - S3, EFS
  StorageStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub '${TemplateBaseURL}/storage.yaml'
      Parameters:
        Environment: !Ref Environment
        VPCId: !GetAtt NetworkStack.Outputs.VPCId
        PrivateSubnetId: !GetAtt NetworkStack.Outputs.PrivateSubnetId
        PublicSubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: PetClinicCICD

  # Database Stack - RDS instance
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub '${TemplateBaseURL}/database.yaml'
      Parameters:
        Environment: !Ref Environment
        DatabaseInstanceClass: !Ref DatabaseInstanceClass
        VPCId: !GetAtt NetworkStack.Outputs.VPCId
        PrivateSubnetId: !GetAtt NetworkStack.Outputs.PrivateSubnetId
        DatabaseSecurityGroupId: !GetAtt NetworkStack.Outputs.DatabaseSecurityGroupId
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: PetClinicCICD

  # Compute Stack - EC2 instances, load balancers
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - NetworkStack
      - IAMStack
      - StorageStack
    Properties:
      TemplateURL: !Sub '${TemplateBaseURL}/compute.yaml'
      Parameters:
        Environment: !Ref Environment
        JenkinsInstanceType: !Ref InstanceType
        AppInstanceType: t3.small
        KeyPairName: !Ref KeyPairName
        VpcId: !GetAtt NetworkStack.Outputs.VPCId
        PublicSubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt NetworkStack.Outputs.PrivateSubnetId
        JenkinsSecurityGroupId: !GetAtt NetworkStack.Outputs.JenkinsSecurityGroupId
        FrontendSecurityGroupId: !GetAtt NetworkStack.Outputs.FrontendSecurityGroupId
        BackendSecurityGroupId: !GetAtt NetworkStack.Outputs.BackendSecurityGroupId
        JenkinsInstanceRole: !GetAtt IAMStack.Outputs.JenkinsInstanceProfile
        AppInstanceRole: !GetAtt IAMStack.Outputs.AppInstanceProfile
        EfsFileSystemId: !GetAtt StorageStack.Outputs.EFSFileSystemId
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: PetClinicCICD

Outputs:
  VPCId:
    Description: VPC ID for the infrastructure
    Value: !GetAtt NetworkStack.Outputs.VPCId
    Export:
      Name: !Sub '${Environment}-VPCId'

  PublicSubnetId:
    Description: Public subnet ID
    Value: !GetAtt NetworkStack.Outputs.PublicSubnetId
    Export:
      Name: !Sub '${Environment}-PublicSubnetId'

  PrivateSubnetId:
    Description: Private subnet ID
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnetId
    Export:
      Name: !Sub '${Environment}-PrivateSubnetId'

  JenkinsServerInstanceId:
    Description: Jenkins server EC2 instance ID
    Value: !GetAtt ComputeStack.Outputs.JenkinsInstanceId
    Export:
      Name: !Sub '${Environment}-JenkinsInstanceId'

  JenkinsServerPublicIP:
    Description: Jenkins server public IP address
    Value: !GetAtt ComputeStack.Outputs.JenkinsPublicIP
    Export:
      Name: !Sub '${Environment}-JenkinsPublicIP'

  DatabaseEndpoint:
    Description: RDS database endpoint
    Value: !GetAtt DatabaseStack.Outputs.DatabaseEndpoint
    Export:
      Name: !Sub '${Environment}-DatabaseEndpoint'

  S3BackupBucket:
    Description: S3 bucket for Jenkins backups
    Value: !GetAtt StorageStack.Outputs.BackupBucketName
    Export:
      Name: !Sub '${Environment}-BackupBucket'

  EFSFileSystemId:
    Description: EFS file system ID for installation scripts
    Value: !GetAtt StorageStack.Outputs.EFSFileSystemId
    Export:
      Name: !Sub '${Environment}-EFSFileSystemId'

  LoadBalancerDNS:
    Description: Application Load Balancer DNS name
    Value: !GetAtt ComputeStack.Outputs.ApplicationLoadBalancerDNS
    Export:
      Name: !Sub '${Environment}-LoadBalancerDNS'