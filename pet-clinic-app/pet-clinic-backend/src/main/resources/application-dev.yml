spring:
  datasource:
    url: jdbc:h2:mem:petclinic
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true  # Let Hibernate create schema first
  
  sql:
    init:
      mode: never  # Disable SQL script initialization - use JPA entities only
      data-locations: []  # Disable data.sql loading
  
  http:
    encoding:
      force: false
      force-request: false
      force-response: false
  
  logging:
    level:
      com.petclinic: DEBUG
      org.springframework.web: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always