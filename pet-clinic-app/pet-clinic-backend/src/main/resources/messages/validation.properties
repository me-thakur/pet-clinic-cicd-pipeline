# ===== DETAILED CORRECTIVE GUIDANCE =====
# Enhanced guidance with specific steps and alternatives

# Mobile Number Guidance
guidance.mobile.format.detailed=Please provide a mobile number in international format: 1) Start with country code (+1, +44, +81, etc.), 2) Include area code, 3) Include phone number. Examples: +1-555-123-4567 (US), +44-7911-123456 (UK), +81-90-1234-5678 (Japan)
guidance.mobile.uniqueness.detailed=This mobile number is already registered. Options: 1) Use a different mobile number if available, 2) Contact support at support@petclinic.com if this is your correct number, 3) Check if you already have an account with this number
guidance.mobile.length.detailed=Mobile number is too long. Please ensure: 1) Remove any extra spaces or formatting, 2) Use only digits, +, -, (, ), 3) Maximum 20 characters including country code

# Email Guidance  
guidance.email.format.detailed=Please provide a valid email address: 1) Include exactly one @ symbol, 2) Have a domain with at least one dot (.com, .org, etc.), 3) Use only letters, numbers, dots, hyphens, underscores. Examples: user@example.com, firstname.lastname@company.org
guidance.email.uniqueness.detailed=This email address is already registered. Options: 1) Use a different email address, 2) Try adding numbers or modifiers (john.doe2@example.com), 3) Contact support at support@petclinic.com if this is your correct email
guidance.email.length.detailed=Email address is too long. Please use a shorter email address (maximum 100 characters)

# Name Guidance
guidance.name.format.detailed=Please provide a valid name: 1) Use only letters (a-z, A-Z), 2) Spaces are allowed, 3) Hyphens (-) and apostrophes (') are allowed, 4) No numbers or special characters. Examples: John, Mary-Jane, O''Connor, José
guidance.name.length.detailed=Name is too long. Please use a shorter name (maximum 50 characters)
guidance.name.required.detailed=Name is required for owner registration. Please provide your full legal name

# Address Guidance
guidance.address.length.detailed=Address is too long. Please shorten to maximum 200 characters while keeping essential information

# ===== FORMAT EXAMPLES BY FIELD =====
# Comprehensive examples for different field types

examples.mobile.international=+1-555-123-4567 (US), +44-7911-123456 (UK), +81-90-1234-5678 (Japan), +49-151-12345678 (Germany), +33-6-12-34-56-78 (France), +61-4-1234-5678 (Australia)
examples.email.formats=user@example.com, firstname.lastname@company.org, user+tag@domain.co.uk, contact@business-name.com
examples.name.formats=John Smith, Mary-Jane O''Connor, José García, François Dubois, 李明 (Li Ming), محمد الرشيد (Mohammed Al-Rashid)
examples.address.formats=123 Main Street, Apt 4B, New York, NY 10001, USA

# ===== CONTEXT-SPECIFIC ERROR MESSAGES =====
# Messages that adapt based on the specific validation context

context.mobile.missing.country.code=Mobile number is missing country code. Please add country code at the beginning (e.g., +1 for US numbers)
context.mobile.contains.letters=Mobile number contains letters. Please remove any letters and use only digits, +, -, (, )
context.mobile.too.short=Mobile number appears incomplete. Please include the full number with area code
context.email.missing.at.symbol=Email address is missing @ symbol. Please add @ between username and domain
context.email.multiple.at.symbols=Email address has multiple @ symbols. Please use only one @ symbol
context.email.missing.domain=Email address is missing domain. Please add domain after @ symbol (e.g., @example.com)
context.name.contains.numbers=Name contains numbers. Please remove any numbers from the name
context.name.invalid.characters=Name contains invalid special characters. Please use only letters, spaces, hyphens, and apostrophes

