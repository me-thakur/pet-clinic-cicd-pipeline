# Enhanced Validation Messages for Owner Data Validation
# Validates: Requirements 3.2, 3.4, 3.5, 5.2

# ===== ERROR MESSAGE TEMPLATES =====
# Templates with placeholders for field name, rejected value, and context

# Format Error Templates
template.format.invalid=Field ''{0}'' has invalid format. Rejected value: ''{1}''. {2}
template.format.mobile.invalid=Mobile number ''{0}'' is not in valid international format. Rejected value: ''{1}''. Expected format: +[country code]-[area code]-[number]
template.format.email.invalid=Email address ''{0}'' is not in valid format. Rejected value: ''{1}''. Expected format: user@domain.com
template.format.name.invalid=Name ''{0}'' contains invalid characters. Rejected value: ''{1}''. Use only letters, spaces, hyphens, and apostrophes

# Uniqueness Error Templates  
template.uniqueness.violation=Field ''{0}'' value ''{1}'' already exists in the system (Entity ID: {2}). Please use a different value
template.uniqueness.mobile.violation=Mobile number ''{0}'' is already registered in the system (Owner ID: {1}). Please use a different mobile number or contact support
template.uniqueness.email.violation=Email address ''{0}'' is already registered in the system (Owner ID: {1}). Please use a different email address or contact support

# Required Field Templates
template.required.missing=Required field ''{0}'' is missing or empty. Please provide a valid {1}
template.required.mobile.missing=Mobile number is required for owner registration. Please provide a valid international mobile number
template.required.email.missing=Email address is required for owner registration. Please provide a valid email address
template.required.name.missing=Name field ''{0}'' is required. Please provide a valid name

# Length Validation Templates
template.length.exceeded=Field ''{0}'' exceeds maximum length of {1} characters. Current length: {2}. Rejected value: ''{3}''
template.length.mobile.exceeded=Mobile number ''{0}'' exceeds maximum length of {1} characters. Please use a shorter format
template.length.email.exceeded=Email address ''{0}'' exceeds maximum length of {1} characters. Please use a shorter email address
template.length.name.exceeded=Name ''{0}'' exceeds maximum length of {1} characters. Please use a shorter name

# Business Rule Templates
template.business.rule.violation=Business rule violation for field ''{0}''. Rejected value: ''{1}''. {2}

