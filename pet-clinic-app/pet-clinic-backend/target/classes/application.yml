spring:
  application:
    name: pet-clinic-backend
  main:
    allow-circular-references: true
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:h2:mem:petclinic
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop  # For H2 in-memory database, recreate schema on startup
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: false  # Disable for H2 in-memory database in dev
  
  sql:
    init:
      mode: never
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m
    cache-names:
      - pets
      - veterinarians
      - visits
      - owners
      - searchResults
      - reports
      - dashboardMetrics
      - statistics

pet-clinic:
  cors:
    allowed-origins: http://localhost:8080

server:
  port: 9090

logging:
  level:
    com.petclinic: DEBUG
    com.petclinic.backend.service.impl.OwnerValidationServiceImpl: INFO
    com.petclinic.backend.service.impl.ValidationMetricsServiceImpl: INFO
    com.petclinic.backend.service.impl.ValidationAuditServiceImpl: DEBUG
    com.petclinic.backend.controller.ValidationController: INFO
    VALIDATION_AUDIT: INFO
    VALIDATION_PERFORMANCE: DEBUG
    VALIDATION_CONFIG: INFO
    VALIDATION_ERROR: ERROR
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: DEBUG

---
# Staging Profile
spring:
  config:
    activate:
      on-profile: staging
  
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petclinicdb}
    username: ${DB_USERNAME:petclinicadmin}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: none  # Let Flyway handle schema creation
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 9090

logging:
  level:
    com.petclinic: INFO
    com.petclinic.backend.service.impl.OwnerValidationServiceImpl: INFO
    com.petclinic.backend.service.impl.ValidationMetricsServiceImpl: INFO
    com.petclinic.backend.service.impl.ValidationAuditServiceImpl: INFO
    com.petclinic.backend.controller.ValidationController: INFO
    VALIDATION_AUDIT: INFO
    VALIDATION_PERFORMANCE: INFO
    VALIDATION_CONFIG: INFO
    VALIDATION_ERROR: ERROR
    org.springframework.security: WARN

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: none  # Let Flyway handle schema creation
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8443
  http:
    port: 8080
  ssl:
    enabled: ${app.https.enabled:true}
    key-store: ${app.https.keystore.path}
    key-store-password: ${app.https.keystore.password}
    key-store-type: ${app.https.keystore.type}
    key-alias: ${app.https.keystore.alias}
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

logging:
  level:
    com.petclinic: WARN
    com.petclinic.backend.service.impl.OwnerValidationServiceImpl: INFO
    com.petclinic.backend.service.impl.ValidationMetricsServiceImpl: WARN
    com.petclinic.backend.service.impl.ValidationAuditServiceImpl: INFO
    com.petclinic.backend.controller.ValidationController: INFO
    VALIDATION_AUDIT: INFO
    VALIDATION_PERFORMANCE: WARN
    VALIDATION_CONFIG: INFO
    VALIDATION_ERROR: ERROR
    org.springframework.security: WARN
  file:
    name: /var/log/pet-clinic-backend.log

# Common Configuration (applies to all profiles)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    show-extensions: true
    show-common-extensions: true
  show-actuator: true
  group-configs:
    - group: 'pet-management'
      display-name: 'Pet Management APIs'
      paths-to-match: '/api/pets/**'
    - group: 'authentication'
      display-name: 'Authentication APIs'
      paths-to-match: '/api/auth/**'
    - group: 'veterinarian-management'
      display-name: 'Veterinarian Management APIs'
      paths-to-match: '/api/veterinarians/**'
    - group: 'visit-management'
      display-name: 'Visit Management APIs'
      paths-to-match: '/api/visits/**'
    - group: 'reporting'
      display-name: 'Reporting APIs'
      paths-to-match: '/api/reports/**'

security:
  jwt:
    secret: ${JWT_SECRET}  # No default - must be explicitly configured
    expiration: 86400000 # 24 hours

pet-clinic:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  api:
    version: v1
    base-path: /api/v1
  data-seeding:
    enabled: true
    skip-if-data-exists: true
    owner-count: 15
    veterinarian-count: 10
    max-pets-per-owner: 3
    max-visits-per-pet: 5
    past-months: 6
    future-months: 3
    generate-medical-history: true
    seed-users: true

# Application-specific configuration
app:
  encryption:
    key: ${ENCRYPTION_KEY:petclinic-encryption-key-32-chars}
  jwt:
    secret: ${JWT_SECRET}  # No default - must be explicitly configured
    expiration: ${JWT_EXPIRATION:3600000} # 1 hour in milliseconds
  session:
    timeout: ${SESSION_TIMEOUT:1800000} # 30 minutes in milliseconds
  https:
    enabled: ${HTTPS_ENABLED:false}
    keystore:
      path: ${KEYSTORE_PATH:classpath:keystore.p12}
      password: ${KEYSTORE_PASSWORD:changeit}
      type: ${KEYSTORE_TYPE:PKCS12}
      alias: ${KEYSTORE_ALIAS:petclinic}
  backup:
    directory: ${BACKUP_DIRECTORY:./backups}
    retention-days: ${BACKUP_RETENTION_DAYS:30}
    auto-backup:
      enabled: ${AUTO_BACKUP_ENABLED:false}
      schedule: ${AUTO_BACKUP_SCHEDULE:0 0 2 * * ?} # Daily at 2 AM

# Owner Data Validation Configuration
petclinic:
  validation:
    mobile-number:
      required: false
      enforce-uniqueness: true
      default-country-code: US
      allow-international: true
    email:
      required: false
      enforce-uniqueness: true
      max-length: 100
    name:
      max-length: 50
      allow-special-characters: true
    general:
      fail-fast: false
      enable-audit-logging: true
    # Circuit breaker configuration for validation service fallback
    circuit-breaker:
      failure-threshold: 5
      recovery-timeout: 30000  # 30 seconds
    retry:
      max-attempts: 3
      delay-ms: 1000  # 1 second