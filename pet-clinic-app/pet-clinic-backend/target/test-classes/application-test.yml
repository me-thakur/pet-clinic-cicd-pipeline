spring:
  application:
    name: pet-clinic-backend-test
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: false
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: false
  
  sql:
    init:
      mode: never  # Disable schema.sql execution

# Disable data seeding for tests
pet-clinic:
  data-seeding:
    enabled: false

# Validation configuration for tests
petclinic:
  validation:
    mobile-number:
      required: false
      enforce-uniqueness: true
      default-country-code: US
      allow-international: true
    email:
      required: false
      enforce-uniqueness: true
      max-length: 100
    name:
      max-length: 50
      allow-special-characters: true
    general:
      fail-fast: false
      enable-audit-logging: false

logging:
  level:
    com.petclinic: WARN
    org.springframework: WARN
    org.hibernate: WARN