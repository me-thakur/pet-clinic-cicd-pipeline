spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: false
  
  sql:
    init:
      mode: never # Disable schema.sql execution

# Test-specific configuration
app:
  encryption:
    key: test-encryption-key-32-characters
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-security-testing
    expiration: 3600000 # 1 hour
  session:
    timeout: 1800000 # 30 minutes
  https:
    enabled: false

logging:
  level:
    com.petclinic: DEBUG
    org.springframework.security: DEBUG