services:
  mysql:
    image: mysql:8.0
    container_name: petclinic-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: petclinic_dev
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic123
      # Enable function creation without SUPER privileges (resolves ERROR 1419)
      MYSQL_INIT_CONNECT: 'SET GLOBAL log_bin_trust_function_creators = 1;'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../pet-clinic-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ../pet-clinic-backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1

volumes:
  mysql_data:
