spring:
  application:
    name: pet-clinic-frontend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  # Add configuration to handle large responses and chunked encoding
  tomcat:
    max-http-response-header-size: 8KB
    max-http-post-size: 2MB
    connection-timeout: 20000
    max-connections: 8192
    # Disable chunked encoding for better compatibility
    use-relative-redirects: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Add response buffering to prevent chunked encoding issues
  http2:
    enabled: false
  compression:
    enabled: false  # Disable compression in dev to avoid chunked encoding

logging:
  level:
    com.petclinic: DEBUG
    org.springframework.security: DEBUG

---
# Staging Profile
spring:
  config:
    activate:
      on-profile: staging
  
  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8

server:
  port: 8080

logging:
  level:
    com.petclinic: INFO
    org.springframework.security: WARN

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

logging:
  level:
    com.petclinic: WARN
    org.springframework.security: WARN
  file:
    name: /var/log/pet-clinic-frontend.log

# Common Configuration (applies to all profiles)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

security:
  session:
    timeout: ${SESSION_TIMEOUT:1800000} # 30 minutes in milliseconds (consistent with backend)

pet-clinic:
  backend:
    # Default backend configuration (can be overridden by profiles)
    url: ${BACKEND_URL:http://localhost:9090}  # Use environment variable
    api-path: /api  # Backend API base path
  ui:
    title: "Pet Clinic Management System"
    version: "1.0.0"
    pagination:
      default-size: 10
      max-size: 100
  frontend:
    session:
      timeout: ${SESSION_TIMEOUT:1800000}  # 30 minutes in milliseconds (consistent with backend)