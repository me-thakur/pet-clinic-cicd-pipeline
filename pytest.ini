[tool:pytest]
# Pytest configuration for MySQL privilege configuration testing

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=mysql_privilege_config
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests for specific functionality
    property: Property-based tests using Hypothesis
    integration: Integration tests requiring MySQL connection
    slow: Tests that take longer to run
    mysql: Tests that require MySQL server
    ci: Tests suitable for CI/CD environments
    local: Tests for local development only

# Hypothesis configuration
hypothesis_profile = default

# Logging configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning:mysql.connector.*
    ignore::PendingDeprecationWarning

# Minimum Python version
minversion = 3.8